services:
  zabgc-bot:                         
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5004:80"                    
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    env_file:
      - .env                         
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"